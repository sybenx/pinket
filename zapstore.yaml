# Zapstore listing (zsp publish, github.com/zapstore/zsp). The APK comes from this
# repository's GitHub releases, signed with Pinket's release key.
repository: https://github.com/sybenx/pinket
name: Pinket
summary: A wee Nostr client for scrolling posts
description: |
  Pinket reads each person's posts from the relays they write to, and sends your replies
  to the relays they read. A post in a language you don't read shows up already
  translated. A reply from an account that several people you follow have muted arrives
  folded shut.

  Also here: private messages, group chats, live streams, hashtag feeds, trending from
  Ditto, and zaps from your own wallet over Nostr Wallet Connect. Spam is scored on the
  phone. Long threads scroll smoothly. There is no built-in wallet, so the download is
  41 MB. Dark gray, with names in an old serif and a small lantern light on anything new.

  Pinket is a fork of Wisp by Barry Deen, which was archived in November 2026. I build it
  for my own daily use and release often. Pinket is an old Worcestershire word for a
  will-o'-the-wisp. MIT, source at github.com/sybenx/pinket.
license: MIT
